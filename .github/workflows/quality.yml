name: DedSec Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout / Λήψη repository
        uses: actions/checkout@v7
      - name: Python / Ρύθμιση Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Dependencies / Dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Tests / Δοκιμές
        run: python -m pytest
      - name: Ruff / Ruff
        run: ruff check . --output-format=github

  shell-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout / Λήψη repository
        uses: actions/checkout@v7
      - name: Install ShellCheck / Εγκατάσταση ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash syntax / Έλεγχος Bash syntax
        shell: bash
        run: |
          set -euo pipefail

          files=(Run.sh Setup.sh Setup-Termux.sh)
          while IFS= read -r -d '' path; do
            if head -n 1 "$path" | grep -Eq '^#!.*(bash|/sh)'; then
              files+=("$path")
            fi
          done < <(find Compat/bin -maxdepth 1 -type f -print0)

          for path in "${files[@]}"; do
            bash -n "$path"
          done
      - name: ShellCheck / Έλεγχος ShellCheck
        shell: bash
        run: |
          set -euo pipefail

          files=(Run.sh Setup.sh Setup-Termux.sh)
          while IFS= read -r -d '' path; do
            if head -n 1 "$path" | grep -Eq '^#!.*(bash|/sh)'; then
              files+=("$path")
            fi
          done < <(find Compat/bin -maxdepth 1 -type f -print0)

          shellcheck --severity=error "${files[@]}"
