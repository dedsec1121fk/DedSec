name: DedSec Project History Cleanup

on:
  workflow_dispatch:
  schedule:
    # Runs every Sunday at 03:00 UTC in whichever repository contains this workflow.
    - cron: "0 3 * * 0"

permissions:
  contents: write

concurrency:
  group: dedsec-project-history-cleanup
  cancel-in-progress: false

jobs:
  clean-history:
    name: Remove historical blobs over 20 MiB
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      LIMIT: 20M
      LIMIT_BYTES: "20971520"
      WORK: "${{ runner.temp }}/dedsec-history-clean.git"
      REPO_URL: "https://github.com/${{ github.repository }}.git"
      AUTH_REPO_URL: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
      TARGET_BRANCH: "${{ github.event.repository.default_branch }}"

    steps:
      - name: Show target repository
        run: |
          set -euo pipefail
          echo "Repository: $REPO_URL"
          echo "Default branch: $TARGET_BRANCH"
          echo "Historical blob limit: $LIMIT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install git-filter-repo
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir git-filter-repo
          git filter-repo --version

      - name: Download repository history on GitHub runner
        run: |
          set -euo pipefail

          rm -rf "$WORK"

          # This happens only inside GitHub's temporary Ubuntu runner.
          # It does not download repository history to the user's device.
          git clone --bare "$AUTH_REPO_URL" "$WORK"

          cd "$WORK"

          echo "Repository history downloaded on GitHub runner."
          echo "Packed size before cleanup:"
          du -sh . || true

      - name: Analyze history
        run: |
          set -euo pipefail
          cd "$WORK"

          git filter-repo --analyze

          echo "History analysis completed."

      - name: Protect current default branch files
        run: |
          set -euo pipefail
          cd "$WORK"

          BRANCH_REF="refs/heads/$TARGET_BRANCH"

          if ! git show-ref --verify --quiet "$BRANCH_REF"; then
            echo "ERROR: Default branch ref was not found: $BRANCH_REF"
            exit 1
          fi

          echo "Checking current $TARGET_BRANCH for files larger than 20 MiB..."

          CURRENT_BIG="$(
            git ls-tree -r -l "$BRANCH_REF" |
            awk -v limit="$LIMIT_BYTES" '$4 != "-" && $4 > limit {print}'
          )"

          if [ -n "$CURRENT_BIG" ]; then
            echo
            echo "CLEANUP SKIPPED SAFELY."
            echo "The current $TARGET_BRANCH branch contains files larger than 20 MiB."
            echo "Historical rewriting was not performed because those files are still in use."
            echo
            echo "$CURRENT_BIG"
            echo
            exit 0
          fi

          echo "Current $TARGET_BRANCH contains no files larger than 20 MiB."

      - name: Re-check current branch before rewriting
        id: safety
        run: |
          set -euo pipefail
          cd "$WORK"

          BRANCH_REF="refs/heads/$TARGET_BRANCH"

          if git ls-tree -r -l "$BRANCH_REF" |
             awk -v limit="$LIMIT_BYTES" '$4 != "-" && $4 > limit {found=1} END {exit !found}'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Current branch contains >20 MiB files; cleanup will be skipped."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove historical blobs larger than 20 MiB
        if: steps.safety.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd "$WORK"

          git filter-repo \
            --strip-blobs-bigger-than "$LIMIT" \
            --force

          echo "History rewrite completed."

      - name: Garbage collect rewritten repository
        if: steps.safety.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd "$WORK"

          git reflog expire --expire=now --all 2>/dev/null || true
          git gc --prune=now --aggressive

          echo "Packed size after cleanup:"
          du -sh . || true

      - name: Restore authenticated origin
        if: steps.safety.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd "$WORK"

          git remote remove origin 2>/dev/null || true
          git remote add origin "$AUTH_REPO_URL"

      - name: Push rewritten branches and tags
        if: steps.safety.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd "$WORK"

          echo "Pushing rewritten branches for $REPO_URL..."
          git push --force --all origin

          echo "Pushing rewritten tags..."
          git push --force --tags origin

          echo
          echo "DONE."
          echo "Repository: $REPO_URL"
          echo "Historical blobs larger than $LIMIT were removed."

      - name: Cleanup skipped summary
        if: steps.safety.outputs.skip == 'true'
        run: |
          echo "Workflow completed without rewriting history."
          echo "Reason: current $TARGET_BRANCH contains one or more files larger than $LIMIT."
          echo "Repository: $REPO_URL"
