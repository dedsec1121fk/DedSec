name: DedSec Project History Cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: write

concurrency:
  group: dedsec-project-history-cleanup
  cancel-in-progress: false

jobs:
  clean-history:
    name: Remove historical blobs over 20 MiB
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      LIMIT: 20M
      LIMIT_BYTES: "20971520"

    steps:
      - name: Initialize
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/dedsec-history-clean.git"

          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "Repository: https://github.com/$GITHUB_REPOSITORY"
          echo "Historical blob limit: $LIMIT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install git-filter-repo
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            git-filter-repo

          git filter-repo --version

      - name: Download complete repository history on GitHub runner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf "$WORK"

          AUTH_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git clone --bare "$AUTH_URL" "$WORK"

          cd "$WORK"

          TARGET_BRANCH="$(git symbolic-ref --short HEAD 2>/dev/null || true)"

          if [ -z "$TARGET_BRANCH" ]; then
            echo "ERROR: Could not determine the default branch."
            exit 1
          fi

          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"

          echo "Repository history downloaded on GitHub's temporary Linux runner."
          echo "Default branch: $TARGET_BRANCH"
          echo "Repository size before cleanup:"
          du -sh . || true

      - name: Analyze repository history
        shell: bash
        run: |
          set -euo pipefail

          cd "$WORK"
          git filter-repo --analyze

          echo "History analysis completed."

      - name: Check current default branch for files over 20 MiB
        id: safety
        shell: bash
        run: |
          set -euo pipefail

          cd "$WORK"

          BRANCH_REF="refs/heads/$TARGET_BRANCH"

          if ! git show-ref --verify --quiet "$BRANCH_REF"; then
            echo "ERROR: Branch does not exist: $BRANCH_REF"
            exit 1
          fi

          CURRENT_BIG="$(
            git ls-tree -r -l "$BRANCH_REF" |
            awk -v limit="$LIMIT_BYTES" '$4 != "-" && $4 > limit {print}'
          )"

          if [ -n "$CURRENT_BIG" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"

            echo
            echo "CLEANUP SKIPPED SAFELY."
            echo "Current $TARGET_BRANCH contains files larger than 20 MiB:"
            echo
            echo "$CURRENT_BIG"
            echo
            echo "No history was rewritten."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Current $TARGET_BRANCH contains no files larger than 20 MiB."
          fi

      - name: Remove historical blobs larger than 20 MiB
        if: steps.safety.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail

          cd "$WORK"

          git filter-repo \
            --strip-blobs-bigger-than "$LIMIT" \
            --force

          echo "History rewrite completed."

      - name: Garbage collect rewritten repository
        if: steps.safety.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail

          cd "$WORK"

          git reflog expire --expire=now --all 2>/dev/null || true
          git gc --prune=now --aggressive

          echo "Repository size after cleanup:"
          du -sh . || true

      - name: Restore authenticated origin
        if: steps.safety.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cd "$WORK"

          AUTH_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git remote remove origin 2>/dev/null || true
          git remote add origin "$AUTH_URL"

      - name: Force-push rewritten branches and tags
        if: steps.safety.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail

          cd "$WORK"

          echo "Force-pushing rewritten branches..."
          git push --force --all origin

          echo "Force-pushing rewritten tags..."
          git push --force --tags origin

          echo
          echo "DONE."
          echo "Repository: https://github.com/$GITHUB_REPOSITORY"
          echo "Historical blobs larger than $LIMIT were removed."

      - name: Cleanup skipped summary
        if: steps.safety.outputs.skip == 'true'
        shell: bash
        run: |
          echo "Workflow finished without rewriting history."
          echo "Reason: current $TARGET_BRANCH contains one or more files larger than $LIMIT."
          echo "Repository: https://github.com/$GITHUB_REPOSITORY"
